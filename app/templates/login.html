<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sessions</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
</head>
<body>
    <div class="login-container">
        <h1>Study Sessions</h1>
        <h2>Login</h2>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <div id="user-select-section">
            <div class="form-group name-search-group">
                <label for="name-search">Name</label>
                <input type="text" id="name-search" autocomplete="off" placeholder="Start typing your name...">
                <div id="search-dropdown" class="search-dropdown hidden"></div>
            </div>
        </div>

        <div id="selected-section" class="hidden">
            <div class="selected-user-card">
                <img id="avatar-img" src="" alt="" class="avatar hidden">
                <div class="avatar-placeholder hidden" id="avatar-placeholder"></div>
                <div class="selected-user-info">
                    <span id="selected-name"></span>
                    <button type="button" id="change-user-btn" class="change-btn">Not you?</button>
                </div>
            </div>
            <form method="POST" action="/login">
                <input type="hidden" id="first_name" name="first_name">
                <input type="hidden" id="last_name" name="last_name">
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePass('password', this)">Show</button>
                    </div>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <p class="support-note">Experiencing bugs? Email: <a href="mailto:scholarship@r71.org">scholarship@r71.org</a></p>
    </div>

    {% if prefill_first_name %}
    <script id="prefill-data" type="application/json">{"first_name": {{ prefill_first_name | tojson }}, "last_name": {{ prefill_last_name | tojson }}}</script>
    {% endif %}
    <script>
        const searchInput = document.getElementById('name-search');
        const dropdown = document.getElementById('search-dropdown');
        const userSelectSection = document.getElementById('user-select-section');
        const selectedSection = document.getElementById('selected-section');

        let fuse = null;
        let loadingUsers = false;

        async function ensureUsersLoaded() {
            if (fuse !== null) return;
            if (loadingUsers) {
                await new Promise(resolve => {
                    const check = setInterval(() => {
                        if (fuse !== null) { clearInterval(check); resolve(); }
                    }, 30);
                });
                return;
            }
            loadingUsers = true;
            try {
                const res = await fetch('/api/users/all');
                const users = await res.json();
                fuse = new Fuse(users, {
                    keys: [{ name: 'first_name', weight: 1 }, { name: 'last_name', weight: 1 }],
                    threshold: 0.4,
                    includeScore: true,
                    useExtendedSearch: false,
                    ignoreLocation: true,
                });
            } catch(e) {
                fuse = new Fuse([]);
            }
        }

        function filterUsers(query) {
            const q = query.trim();
            if (!q || !fuse) return [];
            return fuse.search(q, { limit: 8 }).map(r => r.item);
        }

        searchInput.addEventListener('input', async function () {
            const q = this.value.trim();
            if (q.length === 0) { hideDropdown(); return; }
            await ensureUsersLoaded();
            const currentQ = searchInput.value.trim();
            if (currentQ.length === 0) { hideDropdown(); return; }
            showDropdown(filterUsers(currentQ));
        });

        searchInput.addEventListener('keydown', function (e) {
            const items = dropdown.querySelectorAll('.search-item');
            const active = dropdown.querySelector('.search-item.active');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                const next = active ? active.nextElementSibling : items[0];
                if (next) { active?.classList.remove('active'); next.classList.add('active'); }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prev = active ? active.previousElementSibling : items[items.length - 1];
                if (prev) { active?.classList.remove('active'); prev.classList.add('active'); }
            } else if (e.key === 'Enter' && active) {
                e.preventDefault();
                active.click();
            } else if (e.key === 'Escape') {
                hideDropdown();
            }
        });

        function showDropdown(users) {
            dropdown.innerHTML = '';
            if (users.length === 0) { hideDropdown(); return; }
            users.forEach(user => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.textContent = `${user.first_name} ${user.last_name}`;
                item.addEventListener('click', () => selectUser(user));
                dropdown.appendChild(item);
            });
            dropdown.classList.remove('hidden');
        }

        function hideDropdown() {
            dropdown.classList.add('hidden');
            dropdown.innerHTML = '';
        }

        function selectUser(user) {
            document.getElementById('first_name').value = user.first_name;
            document.getElementById('last_name').value = user.last_name;
            document.getElementById('selected-name').textContent = `${user.first_name} ${user.last_name}`;

            const avatarImg = document.getElementById('avatar-img');
            const placeholder = document.getElementById('avatar-placeholder');
            avatarImg.classList.add('hidden');
            placeholder.classList.add('hidden');

            avatarImg.onload = () => { avatarImg.classList.remove('hidden'); };
            avatarImg.onerror = () => { avatarImg.classList.add('hidden'); showInitialsPlaceholder(user, placeholder); };
            avatarImg.src = '/avatar/' + user.student_id;

            userSelectSection.classList.add('hidden');
            selectedSection.classList.remove('hidden');
            hideDropdown();
            document.getElementById('password').focus();
        }

        function showInitialsPlaceholder(user, el) {
            el.textContent = (user.first_name[0] + (user.last_name[0] || '')).toUpperCase();
            el.classList.remove('hidden');
        }

        document.getElementById('change-user-btn').addEventListener('click', function () {
            selectedSection.classList.add('hidden');
            userSelectSection.classList.remove('hidden');
            searchInput.value = '';
            searchInput.focus();
        });

        document.addEventListener('click', function (e) {
            if (!e.target.closest('#user-select-section')) hideDropdown();
        });

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.textContent = input.type === 'password' ? 'Show' : 'Hide';
        }

        const prefillData = document.getElementById('prefill-data');
        if (prefillData) {
            const p = JSON.parse(prefillData.textContent);
            selectUser({ first_name: p.first_name, last_name: p.last_name, student_id: null });
        }
    </script>
</body>
</html>
