<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sessions</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
</head>
<body>
    <div class="login-container">
        <h1>Study Sessions</h1>
        <h2>Login</h2>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <div id="user-select-section">
            <div class="form-group name-search-group">
                <label for="name-search">Name</label>
                <input type="text" id="name-search" autocomplete="off" placeholder="Start typing your name...">
                <div id="search-dropdown" class="search-dropdown hidden"></div>
            </div>
        </div>

        <div id="selected-section" class="hidden">
            <div class="selected-user-card">
                <img id="avatar-img" src="" alt="" class="avatar hidden">
                <div class="avatar-placeholder hidden" id="avatar-placeholder"></div>
                <div class="selected-user-info">
                    <span id="selected-name"></span>
                    <button type="button" id="change-user-btn" class="change-btn">Not you?</button>
                </div>
            </div>
            <form method="POST" action="/login">
                <input type="hidden" id="first_name" name="first_name">
                <input type="hidden" id="last_name" name="last_name">
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePass('password', this)">Show</button>
                    </div>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <p class="support-note">Experiencing bugs? Email: <a href="mailto:scholarship@r71.org">scholarship@r71.org</a></p>
    </div>

    {% if prefill_first_name %}
    <script id="prefill-data" type="application/json">{"first_name": {{ prefill_first_name | tojson }}, "last_name": {{ prefill_last_name | tojson }}}</script>
    {% endif %}
    <script src="/static/js/login.js"></script>
</body>
</html>
