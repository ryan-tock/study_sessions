<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="portal-container">
        <nav class="navbar">
            <h1>User Portal</h1>
            <div class="nav-links">
                {% if user.is_admin %}
                <a href="/admin/portal" class="admin-link">Go to Admin Portal</a>
                {% endif %}
                <form method="POST" action="/logout" style="display: inline;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
                <div class="nav-avatar-wrapper">
                    <button type="button" class="nav-avatar-btn" onclick="toggleAvatarMenu()">
                        {% if user_profile.discord_id %}
                        <img src="/avatar/{{ user.student_id }}" alt=""
                             style="display: none;"
                             onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
                             onerror="this.style.display='none';">
                        {% endif %}
                        <div class="nav-avatar-initials">{{ ((user_profile.first_name or '?')[0] ~ (user_profile.last_name or '')[0:1])|upper }}</div>
                    </button>
                    <div id="avatar-menu" class="avatar-menu hidden">
                        {% if not user.is_root %}
                        <a href="/user/change_password">Change Password</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <div class="content">
            {% if message %}
            <p class="portal-message">{{ message }}</p>
            {% endif %}
        </div>
    </div>

    <script>
        window.toggleAvatarMenu = function() {
            document.getElementById('avatar-menu').classList.toggle('hidden');
        };
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.nav-avatar-wrapper')) {
                document.getElementById('avatar-menu').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
