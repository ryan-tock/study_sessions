<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sessions</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body>
    <div class="portal-container">
        <nav class="navbar">
            <h1>User Portal</h1>
            <div class="nav-links">
                {% if user.is_admin %}
                <a href="/admin/portal" class="portal-link">Go to Admin Portal</a>
                {% endif %}
                <form method="POST" action="/logout" style="display: inline;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
                <div class="nav-avatar-wrapper">
                    <button type="button" class="nav-avatar-btn" onclick="toggleAvatarMenu()">
                        {% if user_profile.discord_id %}
                        <img src="/avatar/{{ user.student_id }}" alt=""
                             style="display: none;"
                             onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
                             onerror="this.style.display='none';">
                        {% endif %}
                        <div class="nav-avatar-initials">{{ ((user_profile.first_name or '?')[0] ~ (user_profile.last_name or '')[0:1])|upper }}</div>
                    </button>
                    <div id="avatar-menu" class="avatar-menu hidden">
                        {% if not user.is_root %}
                        <a href="/user/change_password">Change Password</a>
                        <a href="/user/privacy">Privacy Settings</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <div class="content">
            {% if message %}
            <p class="portal-message">{{ message }}</p>
            {% endif %}

            <!-- Report Exam -->
            <div class="user-section" id="report-exam-section">
                <h2>Report Exam</h2>
                <div class="assessment-report-row">
                    <select id="assessment-course-select">
                        <option value="" disabled selected>Select course...</option>
                    </select>
                    <input type="date" id="assessment-date-input">
                    <select id="assessment-type-select">
                        <option value="in_class">In-Class Test</option>
                        <option value="quiz">Quiz</option>
                    </select>
                    <button type="button" id="assessment-report-btn" class="btn-action btn-elevate" disabled>Report</button>
                </div>
            </div>

            <!-- Upcoming Exams -->
            <div class="user-section" id="assessments-section">
                <h2>Upcoming Exams</h2>
                <div id="assessments-list" class="user-course-list"></div>
            </div>

            <!-- Study Sessions -->
            <div class="user-section" id="study-sessions-section">
                <h2>Study Sessions</h2>
                <div id="study-sessions-list" class="user-course-list"></div>
            </div>

            <div class="user-sections-row">
                <!-- My Classes -->
                <div class="user-section" id="my-classes-section">
                    <h2>My Classes</h2>
                    <div class="course-search-input-wrap">
                        <input type="text" id="enroll-search-input" placeholder="Add a class…" autocomplete="off">
                    </div>
                    <div id="enroll-search-results" class="course-search-results hidden"></div>
                    <div id="enrolled-list" class="user-course-list"></div>
                </div>

                <!-- I Can Tutor -->
                <div class="user-section" id="i-can-tutor-section">
                    <h2>I Can Tutor</h2>
                    <div class="course-search-input-wrap">
                        <input type="text" id="tutor-search-input" placeholder="Add a course…" autocomplete="off">
                    </div>
                    <div id="tutor-search-results" class="course-search-results hidden"></div>
                    <div id="tutor-add-panel" class="tutor-add-panel hidden">
                        <span id="tutor-selected-course-name" class="tutor-selected-name"></span>
                        <div class="tutor-confidence-row">
                            <label for="tutor-confidence">Confidence (1–10):</label>
                            <input type="number" id="tutor-confidence" min="1" max="10" value="7">
                        </div>
                        <div class="tutor-add-actions">
                            <button type="button" id="tutor-add-btn" class="btn-action btn-elevate">Save</button>
                            <button type="button" id="tutor-cancel-btn" class="btn-action">Cancel</button>
                        </div>
                    </div>
                    <div id="tutor-recommendations" class="tutor-recommendations hidden">
                        <div class="tutor-rec-header">Suggested from your past classes</div>
                        <div id="tutor-rec-list"></div>
                    </div>
                    <div id="tutor-list" class="user-course-list tutor-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/user_portal.js"></script>
</body>
</html>
