<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Study Sessions</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>Study Sessions</h1>
        <h2>Change Password</h2>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/user/change_password" id="change-form">
            <div class="form-group">
                <label for="old_password">Current Password</label>
                <div class="password-field">
                    <input type="password" id="old_password" name="old_password" required autofocus>
                    <button type="button" class="password-toggle" onclick="togglePass('old_password', this)">Show</button>
                </div>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <div class="password-field">
                    <input type="password" id="new_password" name="new_password" required>
                    <button type="button" class="password-toggle" onclick="togglePass('new_password', this)">Show</button>
                </div>
                <ul class="password-requirements" id="reqs">
                    <li id="req-length">At least 12 characters</li>
                    <li id="req-number">At least 1 number</li>
                    <li id="req-special">At least 1 special character</li>
                </ul>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="password-field">
                    <input type="password" id="confirm_password" name="confirm_password" required>
                    <button type="button" class="password-toggle" onclick="togglePass('confirm_password', this)">Show</button>
                </div>
                <p id="match-msg" style="font-size: 13px; margin-top: 6px; display: none;"></p>
            </div>
            <button type="submit" id="submit-btn">Change Password</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="javascript:history.back()" style="color: #7f8c8d; font-size: 14px; text-decoration: none;">Cancel</a>
        </div>
    </div>

    <script>
        const newPass = document.getElementById('new_password');
        const confirmPass = document.getElementById('confirm_password');
        const submitBtn = document.getElementById('submit-btn');
        const SPECIAL = /[!@#$%^&*()\-_=+\[\]{}|;:'",.<>?\/`~\\]/;

        function checkReq(id, met) {
            const el = document.getElementById(id);
            el.classList.toggle('met', met);
            el.classList.toggle('unmet', newPass.value.length > 0 && !met);
        }

        function validateAll() {
            const v = newPass.value;
            const lenOk = v.length >= 12;
            const numOk = /\d/.test(v);
            const specOk = SPECIAL.test(v);
            checkReq('req-length', lenOk);
            checkReq('req-number', numOk);
            checkReq('req-special', specOk);
            return lenOk && numOk && specOk;
        }

        newPass.addEventListener('input', function() {
            validateAll();
            checkMatch();
        });

        confirmPass.addEventListener('input', checkMatch);

        function checkMatch() {
            const msg = document.getElementById('match-msg');
            if (!confirmPass.value) { msg.style.display = 'none'; return; }
            const match = confirmPass.value === newPass.value;
            msg.style.display = 'block';
            msg.textContent = match ? 'Passwords match' : 'Passwords do not match';
            msg.style.color = match ? '#27ae60' : '#e74c3c';
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.textContent = input.type === 'password' ? 'Show' : 'Hide';
        }

        document.getElementById('change-form').addEventListener('submit', function(e) {
            if (!validateAll()) {
                e.preventDefault();
                return;
            }
            if (confirmPass.value !== newPass.value) {
                e.preventDefault();
                document.getElementById('match-msg').style.display = 'block';
                document.getElementById('match-msg').textContent = 'Passwords do not match';
                document.getElementById('match-msg').style.color = '#e74c3c';
            }
        });
    </script>
</body>
</html>
